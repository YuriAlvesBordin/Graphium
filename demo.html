<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphium · Custom Connections</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      overflow: hidden;
      color: #c9ced9;
      background: #08090d;
      font: 12px/1.4 system-ui, sans-serif;
    }
    #stage { position: relative; width: min(800px, calc(100vw - 40px)); height: min(600px, calc(100vh - 40px)); }
    canvas { display: block; width: 100%; height: 100%; border: 1px solid #252936; background: #11131a; }
    .toolbar { position: absolute; z-index: 1; top: 10px; right: 10px; display: flex; gap: 8px; }
    button { padding: .5rem .8rem; border: 1px solid #383d4b; border-radius: 4px; color: #e9ecf3; background: #20232d; cursor: pointer; }
    button:hover { background: #2b2f3c; }
    label.toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: .5rem .8rem;
      border: 1px solid #383d4b;
      border-radius: 4px;
      color: #e9ecf3;
      background: #20232d;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    label.toggle:hover { background: #2b2f3c; }
    #startButton { border-color: #326d4c; background: #238636; }
    #startButton:hover { background: #2ea043; }
    .caption { position: absolute; bottom: 11px; left: 12px; color: #818797; font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; }
    .g2d-label {
      position: absolute;
      font: 12px sans-serif;
      color: #fff;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="g" aria-label="Graphium custom connections demo"></canvas>
    <div class="toolbar">
      <label class="toggle" title="Renderiza as arestas de cliques (3+ nós totalmente conectados) via o centro do grupo">
        <input type="checkbox" id="starToggle"> Modo estrela
      </label>
      <label class="toggle" title="Mostra setas de direção no fim de cada aresta">
        <input type="checkbox" id="arrowToggle"> Setas
      </label>
      <button id="resetButton" type="button">Enquadrar</button>
      <button id="startButton" type="button">Iniciar</button>
    </div>
    <div class="caption">Graphium demo · Arraste para navegar · roda para zoom</div>
  </div>

  <script type="module">
    // This file is intended to sit at the root of the Graphium source package.
    import { Graphium } from "./src/Graphium.js";

    const canvas = document.getElementById("g");
    const startButton = document.getElementById("startButton");
    const resetButton = document.getElementById("resetButton");
    const fitPadding = 135;

    const graph = new Graphium({
      canvas,
      autoStart: false,
      interaction: true,
      camera: {
        minZoom: 0.15,
        maxZoom: 10.35
      },
      physics: {
        repulsion: 800,
        repulsionRadius: 180,
        springStrength: 0.08,
        damping: 0.95,
        gravity: 0.003,
        collisionStrength: 1
      },
      appearance: {
        // Physical radius keeps collision and fit calculations stable.
        nodeRadius: 10,
        // Visual radius remains deliberately small after camera zoom is applied.
        nodeVisualRadius: 9,
        nodeBorderEnabled: true,
        nodeBorderWidth: 0.6,
        nodeBorderColor: "#ffffff",
        fixedRingWidth: 1,
        edgeWidth: 0.7,
        edgeColor: "#8b949e",
        edgeOpacity: 0.65,
        edgeArrowEnabled: true,
        edgeArrowSize: 14,
        edgeArrowWidth: 7
      },
      renderer: {
        clearColor: [0.067, 0.075, 0.102, 1],
        antialias: true
      }
    });

    // Define nodes for the custom connections: A-b, b-c, c-a, a-d, d-f, f-z
    const nodeData = [
      { id: "A", x: 0, y: 0 },
      { id: "b", x: 120, y: 0 },
      { id: "c", x: 60, y: 103.92 }, // 60°, 120 radius
      { id: "d", x: -120, y: 0 },
      { id: "f", x: -60, y: -103.92 },
      { id: "z", x: 0, y: -200 }
    ];

    // Add nodes
    nodeData.forEach(({ id, x, y }) => {
      graph.addNode(id, {
        x,
        y,
        label: id, // show node id as label
        // Use a distinct color per node for clarity
        color: id === "A" ? "#ff6b6b" :
               id === "b" ? "#4ecdc4" :
               id === "c" ? "#ffe66d" :
               id === "d" ? "#95e1d3" :
               id === "f" ? "#f38181" :
                            "#f9ca24",
        fixed: false,
        radius: 10,
        visualRadius: 9
      });
    });

    // Add links as requested
    graph.addLink("link_A_b_1", "A", "b", { color: "#ff6b6b", width: 0.7 });
    graph.addLink("link_A_b_2", "A", "b", { color: "#ff6b6b", width: 0.7 });
    graph.addLink("link_A_b_3", "A", "b", { color: "#ff6b6b", width: 0.7 });
    graph.addLink("link_b_c", "b", "c", { color: "#4ecdc4", width: 0.7 });
    graph.addLink("link_c_a", "c", "A", { color: "#ffe66d", width: 0.7 });
    graph.addLink("link_a_d", "A", "d", { color: "#95e1d3", width: 0.7 });
    graph.addLink("link_d_f", "d", "f", { color: "#f38181", width: 0.7 });
    graph.addLink("link_f_z", "f", "z", { color: "#f9ca24", width: 0.7 });

    function resizeRenderer() {
      const rect = canvas.getBoundingClientRect();
      graph.renderer.resize(
        rect.width,
        rect.height,
        Math.min(window.devicePixelRatio || 1, 2)
      );
      graph.render();
    }

    function fitGraph() {
      resizeRenderer();
      graph.fit(fitPadding);
    }

    const resizeObserver = new ResizeObserver(resizeRenderer);
    resizeObserver.observe(canvas);
    fitGraph();
    window.__graph = graph;

    startButton.addEventListener("click", () => {
      if (graph.running) {
        graph.stop();
        startButton.textContent = "Retomar";
      } else {
        graph.physics.wake();
        graph.start();
        startButton.textContent = "Pausar";
      }
    });

    resetButton.addEventListener("click", fitGraph);

    const starToggle = document.getElementById("starToggle");
    starToggle.addEventListener("change", () => {
      graph.setEdgeStar(starToggle.checked);
      graph.render();
    });

    const arrowToggle = document.getElementById("arrowToggle");
    arrowToggle.addEventListener("change", () => {
      console.log("Arrow toggle changed to:", arrowToggle.checked);
      graph.setAppearance({ edgeArrowEnabled: arrowToggle.checked });
      graph.render();
    });

    // Log link arrow state after a short delay to allow links to be added
    setTimeout(() => {
      if (graph) {
        console.log("Initial linkArrow array:", graph.model.linkArrow);
        console.log("Initial appearance.edgeArrowEnabled:", graph.options.appearance.edgeArrowEnabled);
      }
    }, 500);
  </script>
</body>
</html>
