<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>08 · Export Image (JPEG) — Graphium Examples</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <header>
    <a href="../index.html">← All examples</a>
    <h1>08 · Export Image (JPEG)</h1>
    <p>Exporting the current view as a JPEG image. <code>screenshot()</code> only produces PNG, so this page re-encodes it: draw the capture onto a 2D canvas over a flat background (JPEG has no alpha) and call <code>toDataURL('image/jpeg', quality)</code>.</p>
  </header>
  <main>
    <div class="stage" id="stage"></div>
    <div class="controls">
      <button id="btnShoot" class="primary">Capture JPEG</button>
      <label class="counts">quality
        <input type="range" id="quality" min="0.3" max="0.95" step="0.05" value="0.85" style="vertical-align:middle">
        <b id="qualityValue">0.85</b>
      </label>
      <a id="download" download="graphium-graph.jpg" style="display:none">Download capture</a>
    </div>
    <div class="preview" id="preview" style="display:none">
      <img id="shot" alt="Captured graph">
      <p class="hint" id="meta"></p>
    </div>
  </main>

  <script src="shared.js"></script>
  <script type="module">
    import { Graphium } from "../dist/index.js";

    const graph = Graphium.create({
      container: document.getElementById("stage"),
      autoStart: true,
      autoFit: true,
      physics: { preset: "liquid" },
      theme: { name: "slate" },
    });

    const palette = ["#ff6b6b", "#4ecdc4", "#ffe66d", "#95e1d3", "#aa96da", "#fcbad3"];
    graph.setData({
      nodes: Array.from({ length: 30 }, (_, i) => ({
        id: `n${i}`,
        label: `N${i}`,
        color: palette[i % palette.length],
      })),
      links: Array.from({ length: 42 }, (_, i) => ({
        source: `n${i % 30}`,
        target: `n${(i * 5 + 7) % 30}`,
      })).filter((l) => l.source !== l.target),
    });
    graph.fit(70);

    const quality = document.getElementById("quality");
    quality.addEventListener("input", () => {
      document.getElementById("qualityValue").textContent = Number(quality.value).toFixed(2);
    });

    document.getElementById("btnShoot").addEventListener("click", () => {
      const png = graph.screenshot();
      const image = new Image();
      image.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#12161f"; // flatten transparency: JPEG has no alpha channel
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0);
        const jpeg = canvas.toDataURL("image/jpeg", Number(quality.value));

        const shot = document.getElementById("shot");
        shot.src = jpeg;
        document.getElementById("preview").style.display = "flex";
        const bytes = Math.round((jpeg.length - "data:image/jpeg;base64,".length) * 0.75);
        document.getElementById("meta").textContent =
          `JPEG q=${Number(quality.value).toFixed(2)} · ${canvas.width}×${canvas.height} px · ~${(bytes / 1024).toFixed(0)} KB`;
        const download = document.getElementById("download");
        download.href = jpeg;
        download.style.display = "inline";
      };
      image.src = png;
    });

    window.graph = graph;
    window.__ready = true;
  </script>
</body>
</html>
